# Exemplo: pesquisa domiciliar de resíduos sólidos (Itaqui-Bacanga, São Luís – MA).
# Dados anonimizados salvos em disco; para ler direto do Epicollect5, troque `fonte` por:
#
#   fonte:
#     tipo: epicollect
#     projeto: ${PROJECT_RESIDUOS}     # slug do projeto
#     form_ref: ${FORM_RESIDUOS_REF}   # opcional
#     credenciais: RESIDUOS            # RESIDUOS_CLIENT_ID / RESIDUOS_CLIENT_SECRET no .env

titulo: "Diagnóstico de Resíduos – Itaqui-Bacanga"
subtitulo: "Exemplo com dados anonimizados"

fonte:
  tipo: json
  dados: dados.json
  schema: formulario.json

# Apelidos: nome curto -> final do ref, coluna ou texto da pergunta (veja `geocoleta campos`)
campos:
  localizacao: "f27864"
  idade: "83aec3"
  genero: "88c343"
  etnia: "98c336"
  bairro: "5401ce"
  ocupacao: "d3aecb"
  renda: "43aed7"
  escolaridade: "127852"
  frequencia_coleta: "23aee0"
  destino_lixo: "48c35e"
  separa_reciclagem: "527827"
  avaliacao_coleta: "d27837"

# Bairro é texto livre no formulário; como categoria dá para filtrar e cruzar
tipos:
  bairro: category

ignorar: ["2da40f", "3401cb", "f401ca"]   # consentimento, CEP, logradouro

filtros: [created_at, bairro, idade, genero, renda]

destaques:
  - {campo: frequencia_coleta, por: bairro}
  - {campo: destino_lixo}
  - {campo: avaliacao_coleta, por: renda}
  - {campo: separa_reciclagem, por: escolaridade}

mapa:
  campo: localizacao
  popup: [bairro, idade]

# Páginas próprias deste projeto
extensoes: [paginas]

fuso: America/Fortaleza
