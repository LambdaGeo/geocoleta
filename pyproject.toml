[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geocoleta"
version = "0.1.0"
description = "Dashboards para dados de coleta de campo (Epicollect5), guiados pelo schema do formulário."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LambdaGeo" }]
dependencies = [
    "streamlit>=1.39",
    "pandas>=2.0",
    "plotly>=5.0",
    "folium>=0.15",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
geocoleta = "geocoleta.cli:main"

[tool.setuptools.packages.find]
include = ["geocoleta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
