[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fielddash"
version = "0.1.0"
description = "Schema-driven dashboards for field data collection (Epicollect5)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sergio Costa, LambdaGeo / UFMA" },
    { name = "André Moura, LambdaGeo / UFMA" },
]
dependencies = [
    "streamlit>=1.39",
    "pandas>=2.0",
    "plotly>=5.0",
    "folium>=0.15",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fielddash = "fielddash.cli:main"
geocoleta = "fielddash.cli:main"

[tool.setuptools.packages.find]
include = ["fielddash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
